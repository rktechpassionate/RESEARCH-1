[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weil-gaussian-lab"
version = "1.0.0"
description = "Reproducible polynomial-Gaussian Fourier and finite Weil diagnostics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Rajeev Kumar (Quantovibe Research Group)"}]
license = "MIT"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mpmath>=1.3"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.9", "mypy>=1.14"]
plot = ["matplotlib>=3.7"]

[project.scripts]
weil-gaussian = "weil_gaussian.cli:main"

[project.urls]
Source = "https://github.com/rktechpassionate/RESEARCH-1"
Issues = "https://github.com/rktechpassionate/RESEARCH-1/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weil_gaussian = ["py.typed", "data/golden_vectors.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
include = ["*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/weil_gaussian"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["mpmath.*", "scipy.*"]
ignore_missing_imports = true
