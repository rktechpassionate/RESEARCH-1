[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weil-gaussian-lab"
version = "0.2.0"
description = "Reproducible polynomial-Gaussian Fourier and finite Weil diagnostics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Rajeev Kumar (Quantovibe Research Group)"}]
license = "MIT"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mpmath>=1.3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
plot = ["matplotlib>=3.7"]

[project.scripts]
weil-gaussian = "weil_gaussian.cli:main"

[project.urls]
Source = "https://github.com/rktechpassionate/RESEARCH-1"
Issues = "https://github.com/rktechpassionate/RESEARCH-1/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
